services:
  postgres:
    image: postgres:15-alpine
    container_name: confession_postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-confession_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Đóng port 5432 ra ngoài host để bảo mật DB, chỉ giao tiếp nội bộ qua network
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-confession_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - confession-network

  backend:
    image: ${DOCKER_USERNAME:-phwkha}/confession-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: confession_backend
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-confession_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASS: ${POSTGRES_PASSWORD:-postgres}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080,http://localhost,http://127.0.0.1:5173,http://127.0.0.1:8080,http://127.0.0.1}
    # Đóng port 8080 ra ngoài host, Nginx reverse proxy sẽ gọi qua http://backend:8080 trong mạng nội bộ
    # ports:
    #   - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/confessions || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - confession-network

  frontend:
    image: ${DOCKER_USERNAME:-phwkha}/confession-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: confession_frontend
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - confession-network

volumes:
  postgres_data:
    driver: local

networks:
  confession-network:
    driver: bridge
