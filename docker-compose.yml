services:
  postgres:
    image: postgres:15-alpine
    container_name: confession_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-confession_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Đóng port 5432 ra ngoài host để bảo mật DB, chỉ giao tiếp nội bộ qua network
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-confession_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - confession-network

  backend:
    image: ${DOCKER_USERNAME:-phwkha}/confession-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: confession_backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-confession_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASS: ${POSTGRES_PASSWORD:-postgres}
    # Đóng port 8080 ra ngoài host, Nginx reverse proxy sẽ gọi qua http://backend:8080 trong mạng nội bộ
    # ports:
    #   - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - confession-network

  frontend:
    image: ${DOCKER_USERNAME:-phwkha}/confession-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: confession_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      - backend
    networks:
      - confession-network

volumes:
  postgres_data:
    driver: local

networks:
  confession-network:
    driver: bridge
