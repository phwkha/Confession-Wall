spring:
  datasource:
    url: jdbc:h2:mem:confession_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:8080,http://localhost,http://127.0.0.1:5173,http://127.0.0.1:8080,http://127.0.0.1
